<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>军棋 · 布阵</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="layoutWrap">
    <header class="topbar">
      <button id="backBtn">‹ 返回</button>
      <span id="title">布阵 · 黑方</span>
      <span class="spacer"></span>
    </header>

    <div id="layoutHost">
      <canvas id="layoutCanvas"></canvas>
    </div>
    <div id="layoutMsg"></div>
    <div id="palette"></div>
    <div id="layoutBar">
      <button class="btn secondary" id="randomBtn">随机布阵</button>
      <button class="btn ghost" id="clearBtn">清空</button>
      <button class="btn ghost" id="formLibBtn">阵型库</button>
      <button class="btn ghost" id="saveFormBtn">保存阵型</button>
      <button class="btn" id="confirmBtn">确认布阵</button>
    </div>
  </div>

  <div class="overlay" id="handoff">
    <div class="box">
      <h2>请交接设备</h2>
      <div class="big" id="handoffText">请把设备交给红方</div>
      <p class="sub">对方布阵时请勿偷看。准备就绪后点击继续。</p>
      <button class="btn" id="handoffBtn">交给对方</button>
    </div>
  </div>

  <div class="overlay" id="formationPanel">
    <div class="box">
      <h2>阵型库</h2>
      <p class="sub">点击预设或我的阵型即可一键布阵。</p>
      <div id="formationList"></div>
      <button class="btn" id="formCloseBtn">关闭</button>
    </div>
  </div>

  <script src="js/board.js"></script>
  <script src="js/pieces.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/presets.js"></script>
  <script src="js/common.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/layout.js"></script>
</body>
</html>
